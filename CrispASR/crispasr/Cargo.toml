[package]
name = "crispasr"
version = "0.8.25"
edition = "2021"
description = "Safe Rust wrapper for CrispASR — lightweight on-device speech recognition (Whisper, Qwen3-ASR, FastConformer, and more)."
license = "MIT"
repository = "https://github.com/CrispStrobe/CrispASR"
homepage = "https://github.com/CrispStrobe/CrispASR"
documentation = "https://docs.rs/crispasr"
readme = "README.md"
keywords = ["asr", "speech-recognition", "whisper", "ggml", "speech-to-text"]
categories = ["multimedia::audio", "api-bindings"]

# path + version dep on the sibling -sys crate. The path resolves for local
# development AND for git/path downstream consumers (cargo finds crispasr-sys
# inside the checkout); on `cargo publish` the path is stripped and the version
# pin resolves the crates.io release (both crates are published there). See
# README.md for the two consumption modes (git build-from-source vs crates.io
# release + a pre-built lib via CRISPASR_LIB_DIR).
[dependencies]
crispasr-sys = { path = "../crispasr-sys", version = "0.8.25" }

[features]
default = []
cuda = ["crispasr-sys/cuda"]
metal = ["crispasr-sys/metal"]
vulkan = ["crispasr-sys/vulkan"]

[dev-dependencies]
hound = "3.5"

[package.metadata.docs.rs]
# docs.rs has no native libcrispasr installed — disable build.rs link
# probing by exposing a stub, or document that docs builds need the lib.
all-features = true
