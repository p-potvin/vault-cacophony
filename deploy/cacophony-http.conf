# cacophony.vaultwares.ca - temporary port-80 block for ACME issuance only.
# Replaced by the full conf once the cert exists.

server {
    listen 80;
    listen [::]:80;
    server_name cacophony.vaultwares.ca;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}