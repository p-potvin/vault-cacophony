# cacophony.vaultwares.ca - Cacophony multi-speaker conversation studio UI, tailnet-only
# Proxies to the Cacophony UI server on clopeux-desktop (100.71.101.21:8753).
# Installed: Mon, 26 Oct 2026. Same shape as miniville: public 80 for ACME,
# everything else tailnet-only.

server {
    listen 80;
    listen [::]:80;
    server_name cacophony.vaultwares.ca;
    include snippets/acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cacophony.vaultwares.ca;

    # Tailnet only: the public name resolves here too, everyone else gets 403.
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    deny all;

    ssl_certificate /etc/letsencrypt/live/cacophony.vaultwares.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cacophony.vaultwares.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # The studio streams console output live (SSE) and generates audio, so keep
    # proxying snappy and give long-running orchestrator calls room.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://100.71.101.21:8753;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }
}